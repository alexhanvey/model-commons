[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "community-llm-api"
version = "0.1.0"
description = "Control-plane API for the community LLM network"
requires-python = ">=3.12"
dependencies = [
  "community-llm-protocol",
  "fastapi>=0.115",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "uvicorn[standard]>=0.30",
]

[tool.uv.sources]
community-llm-protocol = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/community_llm_api"]
