[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "community-llm-protocol"
version = "0.1.0"
description = "Shared protocol models for the community LLM network"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9"]

[tool.hatch.build.targets.wheel]
packages = ["src/community_llm_protocol"]
