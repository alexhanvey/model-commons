[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "community-llm-sdk"
version = "0.1.0"
description = "Python client for the community LLM network"
requires-python = ">=3.12"
dependencies = [
  "community-llm-protocol",
  "httpx>=0.27",
  "pydantic>=2.9",
]

[tool.uv.sources]
community-llm-protocol = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/community_llm_sdk"]
