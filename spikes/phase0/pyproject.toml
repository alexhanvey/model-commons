[project]
name = "community-llm-phase0-spikes"
version = "0.0.0"
description = "Phase 0 technical spikes for the community LLM project"
requires-python = ">=3.12"
dependencies = [
  "accelerate>=1.0",
  "bitsandbytes>=0.44",
  "datasets>=3.0",
  "huggingface-hub>=0.26",
  "jsonschema>=4.23",
  "openai>=1.50",
  "peft>=0.13",
  "pynvml>=11.5",
  "torch>=2.4",
  "transformers>=4.45",
]

[project.optional-dependencies]
vllm = ["vllm>=0.8"]

[tool.uv]
package = false
